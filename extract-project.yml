name: Extract project
on:
  push:
    paths:
      - 'Djalil_Delivery_FullStack.zip'
      - '.github/workflows/extract-project.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          unzip -o Djalil_Delivery_FullStack.zip -d extracted
          cp -R extracted/. .
          rm -rf extracted Djalil_Delivery_FullStack.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Djalil Delivery project" || exit 0
          git push
