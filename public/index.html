<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Djalil Delivery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 8px;
      color: #ccc;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-bottom: 10px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #f5c400;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>🚚 Djalil Delivery</h1>
    <p>Livraison rapide et fiable</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>🍔 Commander</h2>
      <p>Commandez votre repas facilement.</p>
      <a href="#" class="btn">Commander maintenant</a>
    </div>

    <div class="card">
      <h2>📦 Livraison</h2>
      <p>Suivez votre commande et recevez-la rapidement.</p>
      <a href="#" class="btn">Voir les livraisons</a>
    </div>

    <div class="card">
      <h2>📞 Contact</h2>
      <p>Besoin d'aide ? Contactez-nous.</p>
      <a href="tel:+213000000000" class="btn">Nous contacter</a>
    </div>

  </div>

  <footer>
    © 2026 Djalil Delivery
  </footer>

</body>
</html>
