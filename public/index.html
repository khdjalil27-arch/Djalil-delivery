<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Djalil Delivery</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5;color:#111}header{background:#111;color:white;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:4}.logo{font-size:23px;font-weight:900}.logo b{color:#ffd21c}button{border:0;border-radius:11px;padding:11px 15px;font-weight:bold;cursor:pointer}.yellow{background:#ffd21c}.dark{background:#111;color:#fff}.hero{background:#111;color:#fff;text-align:center;padding:55px 5%}.hero h1{font-size:40px}.hero span{color:#ffd21c}.search{max-width:650px;margin:auto;display:flex;background:#fff;border-radius:13px;overflow:hidden}.search input{flex:1;border:0;padding:15px;outline:0}.search button{border-radius:0;background:#ffd21c}main{max-width:1150px;margin:auto;padding:25px 5%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:17px}.card{background:#fff;border-radius:17px;padding:15px;box-shadow:0 5px 15px #0001}.emoji{font-size:55px;text-align:center;padding:15px}.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.price{font-weight:900;font-size:18px}.panel{position:fixed;inset:0;background:#fff;z-index:8;padding:22px;overflow:auto;display:none}.panel.show{display:block}.box{max-width:500px;margin:30px auto}.box input,.box textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:10px}.order{background:#fff;margin:10px 0;padding:15px;border-radius:14px}.status{display:inline-block;background:#ffd21c;padding:6px 9px;border-radius:8px;font-weight:bold}.nav{display:flex;gap:8px;align-items:center}.muted{color:#777}
</style></head><body>
<header><div class="logo">DJALIL <b>DELIVERY</b></div><div class="nav"><button onclick="showAuth()">حسابي</button><button class="yellow" onclick="showCart()">🛒 <span id="cnt">0</span></button></div></header>
<section class="hero"><h1>وش حاب <span>تاكل اليوم؟</span> 🍔</h1><p>اطلب، خلّي الباقي علينا 🇩🇿</p><div class="search"><input id="search" placeholder="ابحث عن برغر، بيتزا، كريب..." oninput="render()"><button>بحث</button></div></section>
<main><h2>الأكلات</h2><div class="grid" id="products"></div><h2>طلباتي</h2><div id="orders"><p class="muted">سجّل الدخول لرؤية طلباتك.</p></div></main>
<div id="panel" class="panel"></div>
<script>
let products=[],cart=JSON.parse(localStorage.cart||"[]"),token=localStorage.token||"",user=JSON.parse(localStorage.user||"null");
const $=id=>document.getElementById(id);
async function api(url,opt={}){opt.headers={...(opt.headers||{}), "Content-Type":"application/json"};if(token)opt.headers.Authorization="Bearer "+token;let r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||"حدث خطأ");return d}
async function init(){products=await api("/api/products");render();update();if(token)loadOrders()}function render(){let q=$("search").value.toLowerCase();$("products").innerHTML=products.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<div class="card"><div class="emoji">${p.emoji}</div><h3>${p.name}</h3><small>${p.restaurant} · ${p.category||""}</small><div class="row"><span class="price">${p.price} دج</span><button class="dark" onclick="add(${p.id})">+ أضف</button></div></div>`).join("")}
function add(id){let x=cart.find(i=>i.id==id);x?x.q++:cart.push({id,q:1});save();showCart()}function save(){localStorage.cart=JSON.stringify(cart);update()}function update(){$("cnt").textContent=cart.reduce((a,x)=>a+x.q,0)}
function showCart(){let rows=cart.map(i=>{let p=products.find(p=>p.id==i.id);return `<div class="order"><b>${p.name}</b><div>${p.price} دج × ${i.q}<button onclick="del(${i.id})">حذف</button></div></div>`}).join("");let total=cart.reduce((s,i)=>s+products.find(p=>p.id==i.id).price*i.q,0)+300;$("panel").innerHTML=`<div class="box"><button onclick="closePanel()">✕</button><h2>السلة</h2>${rows||"<p>السلة فارغة</p>"}${cart.length?`<h3>المجموع مع التوصيل: ${total} دج</h3><textarea id="address" placeholder="العنوان بالتفصيل"></textarea><input id="phone" placeholder="رقم الهاتف" value="${user?.phone||""}"><button class="yellow" style="width:100%" onclick="checkout()">تأكيد الطلب</button>`:""}</div>`;$("panel").classList.add("show")}
function del(id){cart=cart.filter(x=>x.id!=id);save();showCart()}function closePanel(){$("panel").classList.remove("show")}
function showAuth(){$("panel").innerHTML=`<div class="box"><button onclick="closePanel()">✕</button><h2>حساب Djalil Delivery</h2><input id="name" placeholder="الاسم"><input id="phone" placeholder="رقم الهاتف"><input id="pass" type="password" placeholder="كلمة السر"><button class="yellow" style="width:100%" onclick="register()">إنشاء حساب</button><hr><button class="dark" style="width:100%" onclick="login()">دخول</button></div>`;$("panel").classList.add("show")}
async function register(){try{let d=await api("/api/register",{method:"POST",body:JSON.stringify({name:$("name").value,phone:$("phone").value,password:$("pass").value})});setSession(d);alert("تم إنشاء الحساب");closePanel();loadOrders()}catch(e){alert(e.message)}}async function login(){try{let d=await api("/api/login",{method:"POST",body:JSON.stringify({phone:$("phone").value,password:$("pass").value})});setSession(d);alert("تم الدخول");closePanel();loadOrders()}catch(e){alert(e.message)}}function setSession(d){token=d.token;user=d.user;localStorage.token=token;localStorage.user=JSON.stringify(user)}
async function checkout(){if(!token){alert("سجّل الدخول أولاً");return}try{await api("/api/orders",{method:"POST",body:JSON.stringify({items:cart,address:$("address").value,phone:$("phone").value})});cart=[];save();alert("تم تسجيل الطلب بنجاح 🎉");closePanel();loadOrders()}catch(e){alert(e.message)}}
async function loadOrders(){try{let os=await api("/api/orders");$("orders").innerHTML=os.length?os.map(o=>`<div class="order"><b>طلب #${o.id}</b><p>المجموع: ${o.total} دج</p><span class="status">${o.status}</span></div>`).join(""):"<p class='muted'>لا توجد طلبات بعد.</p>"}catch{}}
init();
</script></body></html>
